services:
  postgres:
    image: postgres:16
    container_name: reminders_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reminders
      POSTGRES_USER: reminders_user
      POSTGRES_PASSWORD: reminders_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reminders_user -d reminders"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: reminders_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

